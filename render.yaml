# Blueprint de Render: API Django (de pago) + frontend Quasar (Static Site gratis).
# La base de datos está en Neon (DATABASE_URL). Pasos completos en README.md, sección "Despliegue".
# Las variables con `sync: false` son secretos o URLs: Render las pide al crear el Blueprint
# y nunca se guardan en el repo.

services:
  # --- API (Django + gunicorn) ---
  - type: web
    name: raite-api
    runtime: python
    plan: 0.5c-512mb # la instancia de pago más chica; el plan gratis bloquea el SMTP de Gmail
    region: oregon # la misma región que el proyecto de Neon (AWS us-west-2)
    rootDir: Back_Raite
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - Back_Raite/**
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput && python manage.py cargar_datos_iniciales
    startCommand: gunicorn Raite_DjangoRest.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Correo: SMTP de Gmail con contraseña de aplicación
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: raite.uacj@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Raite <raite.uacj@gmail.com>

  # --- Frontend (build de Quasar) ---
  - type: web
    name: raite-web
    runtime: static
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - Front_Raite/**
    buildCommand: cd Front_Raite && npx --yes pnpm@10.33.0 install --frozen-lockfile && npx --yes pnpm@10.33.0 build
    staticPublishPath: Front_Raite/dist/spa
    routes:
      # El router usa modo history: toda ruta sirve index.html y Vue Router decide.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: VITE_API_URL # se mete al compilar; si cambia, volver a desplegar
        sync: false
